<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DDD Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#EDF0F3; --sheet:#FFFFFF; --ink:#1D2433; --muted:#6A7284; --line:#E1E5EB; --line2:#C4CCD7;
  --pen:#2F55D4; --pen-soft:#E7ECFB; --danger:#C93B3B;
  --hl-op:.62; --hl-blend:multiply;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13161C; --sheet:#1B1F27; --ink:#E7EAF0; --muted:#9AA2B2; --line:#2A303B; --line2:#3B4350;
    --pen:#86A2FF; --pen-soft:#232B42; --danger:#FF7A7A; --hl-op:.5; --hl-blend:normal; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13161C; --sheet:#1B1F27; --ink:#E7EAF0; --muted:#9AA2B2; --line:#2A303B; --line2:#3B4350;
  --pen:#86A2FF; --pen-soft:#232B42; --danger:#FF7A7A; --hl-op:.5; --hl-blend:normal; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.hand{font-family:"Nanum Pen Script","IBM Plex Sans KR",cursive}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:-.02em;font-size:18px;display:flex;align-items:baseline;gap:6px}
.brand b{background:linear-gradient(transparent 55%,#FFE14D 55%,#FFE14D 90%,transparent 90%);padding:0 2px}
.brand small{font-weight:400;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:2px;background:var(--bg);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:500;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tracker{margin-left:auto;display:flex;align-items:center;gap:8px}
.tbtn{border:1px solid var(--line2);background:var(--sheet);border-radius:999px;padding:6px 14px;font-weight:600;display:flex;align-items:center;gap:6px}
.tbtn.run{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.tlive{display:flex;align-items:center;gap:8px;font-size:14px;max-width:46vw}
.tlive .dot{width:9px;height:9px;border-radius:50%;background:#E5484D;animation:blink 1.4s infinite;flex:none}
.tlive .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlive .tm{font-variant-numeric:tabular-nums;font-weight:600}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.tlive .dot{animation:none}}

main{max-width:1240px;margin:0 auto;padding:16px 16px 80px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{margin:0 0 2px;font-size:20px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
h2 small{font-size:13px;font-weight:400;color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.ghost{border:1px solid var(--line2);background:transparent;border-radius:8px;padding:6px 12px}
.primary{border:0;background:var(--pen);color:#fff;border-radius:8px;padding:8px 14px;font-weight:600}
:root[data-theme="dark"] .primary{color:#0D1220}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .primary{color:#0D1220}}
.icon{border:1px solid var(--line2);background:var(--sheet);width:34px;height:34px;border-radius:8px;font-size:18px;line-height:1;display:grid;place-items:center}
.danger{color:var(--danger);border-color:currentColor}
input[type=text],input[type=time],input:not([type]),select,textarea{border:1px solid var(--line2);background:var(--sheet);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical}

/* day head */
.dayhead{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.dtitle{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 4px}
.dtitle span{font-weight:500;color:var(--muted);font-size:16px;margin-left:4px}
.dtitle small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.daylayout{display:grid;grid-template-columns:minmax(260px,330px) 1fr;grid-template-areas:"plan do" "see do";grid-template-rows:auto 1fr;gap:14px;align-items:start}
.daylayout .plan{grid-area:plan}.daylayout .see{grid-area:see}.daylayout .do{grid-area:do}
@media (max-width:860px){.daylayout{grid-template-columns:1fr;grid-template-areas:"plan" "do" "see"}}

/* todos */
.todos{list-style:none;margin:0;padding:0}
.todos li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.todos li .tt{flex:1;min-width:0;word-break:break-all}
.todos li.done .tt{text-decoration:line-through;color:var(--muted)}
.todos li .time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.todos li .x{border:0;background:none;color:var(--muted);font-size:16px;padding:0 4px}
.chk{appearance:none;width:20px;height:20px;border:1.6px solid var(--line2);border-radius:5px;margin:0;display:grid;place-items:center;flex:none;background:var(--sheet)}
.chk:checked{background:var(--pen);border-color:var(--pen)}
.chk:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.addrow{display:flex;gap:6px;margin-top:10px}
.addrow input[type=text]{flex:1}
.addrow input[type=time]{width:104px}
.rate{font-size:13px;color:var(--muted);margin-top:8px}
.rate b{color:var(--ink)}
.seebox textarea{font-family:"Nanum Pen Script",cursive;font-size:22px;line-height:32px;min-height:200px;border:0;padding:0 4px;background:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);border-radius:0}

/* brush */
.brush{display:grid;gap:10px;margin:10px 0 12px;padding:12px;border-radius:12px;background:var(--bg)}
.brow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brow > label{font-size:12px;color:var(--muted);min-width:44px}
.brow input#bText{flex:1;min-width:160px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.cchip{border:1.5px solid transparent;background:var(--sheet);border-radius:999px;padding:4px 10px 4px 6px;display:flex;align-items:center;gap:6px;font-size:13px}
.cchip i{width:16px;height:12px;border-radius:3px 6px 4px 7px;display:block;opacity:.9}
.cchip[aria-pressed="true"]{border-color:var(--ink);font-weight:600}
.pchip{border:1px dashed var(--line2);background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;display:flex;gap:5px;align-items:center}
.pchip i{width:8px;height:8px;border-radius:50%}
.modes{display:flex;background:var(--sheet);border-radius:9px;padding:3px;gap:2px;border:1px solid var(--line)}
.modes button{border:0;background:transparent;border-radius:7px;padding:5px 11px;font-size:13px;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.draginfo{font-size:13px;color:var(--pen);font-weight:600;font-variant-numeric:tabular-nums;min-height:20px}

/* tags */
.tagbox{display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:1px solid var(--line2);background:var(--sheet);border-radius:8px;padding:4px 6px;flex:1;min-width:160px}
.tagbox input{border:0 !important;padding:3px 4px !important;flex:1;min-width:80px;outline:none;background:transparent}
.tag{background:var(--pen-soft);color:var(--pen);border-radius:6px;padding:1px 6px;font-size:12px;display:inline-flex;gap:4px;align-items:center}
.tag button{border:0;background:none;padding:0;color:inherit;font-size:13px;line-height:1}

/* do grid */
.gridwrap{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.grid{max-height:min(68vh,760px);overflow-y:auto;overscroll-behavior:contain;position:relative}
.row{display:grid;grid-template-columns:46px 1fr;height:40px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.hl{display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;border-right:1px solid var(--line2);touch-action:pan-y;user-select:none;background:var(--sheet)}
.row.cur .hl{color:var(--pen);font-weight:700}
.track{position:relative;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100% / 6) 100%;user-select:none;-webkit-user-select:none}
.grid[data-mode="paint"] .track,.grid[data-mode="erase"] .track{touch-action:none;cursor:crosshair}
.grid[data-mode="select"] .track{cursor:pointer}
.seg{position:absolute;top:6px;bottom:6px;opacity:var(--hl-op);mix-blend-mode:var(--hl-blend);border-radius:3px 7px 4px 8px / 7px 3px 8px 4px;transform:skewX(-4deg)}
.seglabel{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:4px;padding:0 6px;font-family:"Nanum Pen Script",cursive;font-size:19px;line-height:1;white-space:nowrap;overflow:hidden;pointer-events:none;color:var(--ink)}
.seglabel .t{font-family:"IBM Plex Sans KR",sans-serif;font-size:10px;color:var(--muted)}
.seg.live{background-image:repeating-linear-gradient(-45deg,transparent 0 6px,rgba(255,255,255,.45) 6px 9px)}
.pv{position:absolute;top:3px;bottom:3px;border:2px dashed var(--ink);border-radius:6px;pointer-events:none;background:rgba(127,127,127,.08)}
.pv.erase{border-color:var(--danger);background:rgba(201,59,59,.08)}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:#E5484D;pointer-events:none}
.nowline::before{content:"";position:absolute;top:-3px;left:-3px;width:8px;height:8px;border-radius:50%;background:#E5484D}

/* summary / list */
.sumbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--bg);margin:12px 0 6px}
.sumbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px}
.legend b{color:var(--ink);font-weight:600}
.elist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px}
.elist li{display:grid;grid-template-columns:8px 92px 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer}
.elist li:hover{background:var(--bg)}
.elist .c{width:8px;height:28px;border-radius:3px}
.elist .tm{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.elist .nm{min-width:0}
.elist .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.elist .nm .sub{font-size:12px;color:var(--muted)}
.badge{font-size:11px;border:1px solid var(--line2);border-radius:5px;padding:0 5px;color:var(--muted)}
.dohead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}

/* week */
.weekgoals{margin-bottom:14px}
.weekcols{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.wcol{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:150px}
.wcol.today{border-color:var(--pen);box-shadow:inset 0 3px 0 var(--pen)}
.wcol header{display:flex;justify-content:space-between;align-items:baseline;cursor:pointer}
.wcol header b{font-size:16px}
.wcol header .dn{color:var(--muted);font-size:13px}
.wcol.sun header .dn,.wcol.sun header b{color:#D14B4B}
.wcol.sat header .dn{color:#3D6FD6}
.mini{position:relative;height:216px;background:var(--bg);border-radius:6px;overflow:hidden;cursor:pointer}
.mini i{position:absolute;left:0;right:0;opacity:var(--hl-op);mix-blend-mode:var(--hl-blend)}
.mini .tick{position:absolute;left:0;right:0;border-top:1px dashed var(--line2);font-size:9px;color:var(--muted);padding-left:2px;line-height:1.2}
.wcol .todos li{padding:4px 0;font-size:13px}
.wcol .addrow input{font-size:13px;padding:5px 8px}
.wsum{font-size:12px;color:var(--muted)}

/* stats */
.stathead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg3{display:flex;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg3 button{border:0;background:transparent;border-radius:8px;padding:6px 14px;color:var(--muted);font-weight:500}
.seg3 button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.plabel{font-weight:700;font-size:18px;min-width:150px;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.charts{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media (max-width:860px){.charts{grid-template-columns:1fr}}
.cbox{position:relative;height:320px}
.cbox.sm{height:260px}
.taglist{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.taglist li{display:grid;grid-template-columns:110px 1fr 60px;gap:8px;align-items:center;font-size:13px}
.taglist .bar{height:8px;border-radius:4px;background:var(--pen);opacity:.7}
.taglist .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

/* settings */
.setgrid{display:grid;gap:14px;max-width:760px}
.catrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.catrow input{flex:1;min-width:120px}
.swatches{display:flex;gap:4px}
.sw{width:22px;height:22px;border-radius:5px;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.status i{width:8px;height:8px;border-radius:50%;background:#9AA2B2}
.status.ok i{background:#2FA86B}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,22,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.mbox{background:var(--sheet);border-radius:16px;width:min(520px,100%);max-height:calc(100% - 16px);overflow:auto;padding:18px;display:grid;gap:12px;margin-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:600px){.modal{align-items:center}}
.mbox h3{margin:0;font-size:18px}
.field{display:grid;gap:4px}
.field > span{font-size:12px;color:var(--muted)}
.trow{display:flex;gap:8px;align-items:center}
.trow input{flex:1}
.mfoot{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.mfoot .sp{flex:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.toast button{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline}

/* ---- v2 additions ---- */
.tabs{overflow-x:auto;max-width:100%}
.tabs button{white-space:nowrap}
.tabs[hidden],.tabs button[hidden]{display:none}
.gate{max-width:460px;margin:8vh auto 0;text-align:left}
.gate h1{font-size:28px;letter-spacing:-.02em;margin:0 0 6px}
.gate h1 b{background:linear-gradient(transparent 55%,#FFE14D 55%,#FFE14D 90%,transparent 90%)}
.gate p{color:var(--muted);margin:0 0 14px}
.gate .field{margin-bottom:12px}
.gate .primary{width:100%;padding:11px}
.gate .ghost{width:100%;margin-top:8px;padding:10px}
.agree{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:10px 0 16px}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--pen-soft);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.notice b{white-space:nowrap}
.notice span{flex:1;white-space:pre-wrap}
.notice button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subnav button{border:1px solid var(--line2);background:var(--sheet);border-radius:999px;padding:6px 14px;font-size:14px}
.subnav button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.profile{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.avatar{width:56px;height:56px;border-radius:50%;background:#FFE14D;display:grid;place-items:center;font-weight:700;font-size:22px;color:#1D2433;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile .who b{font-size:18px;display:block}
.profile .who span{color:var(--muted);font-size:13px}
.mini-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:12px 0}
.mini-stats div{background:var(--bg);border-radius:10px;padding:10px 12px}
.mini-stats span{font-size:12px;color:var(--muted);display:block}
.mini-stats b{font-size:18px;font-variant-numeric:tabular-nums}
.catrow .order{display:flex;gap:2px}
.catrow .order button{width:28px;height:28px;font-size:13px}
.catrow .swbtn{width:30px;height:30px;border-radius:7px;border:1px solid var(--line2);padding:0}
.catrow .cnt{font-size:12px;color:var(--muted);min-width:64px;text-align:right}
.palpop{display:flex;gap:4px;flex-wrap:wrap;align-items:center;width:100%;padding:6px 0 2px 36px}
.palpop[hidden]{display:none}
.palpop input[type=color]{width:34px;height:26px;border:1px solid var(--line2);border-radius:6px;padding:0;background:none}
.linkbtn{border:0;background:none;color:var(--pen);padding:0;font-size:13px;text-decoration:underline}
/* photos */
.phstrip{display:flex;gap:8px;flex-wrap:wrap}
.phitem{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.phitem img{width:100%;height:100%;object-fit:cover;display:block}
.phitem .rm{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1}
.phitem .st{position:absolute;left:0;right:0;bottom:0;font-size:10px;text-align:center;background:rgba(0,0,0,.55);color:#fff;padding:1px 0}
.phitem.busy img{opacity:.4}
.phadd{width:76px;height:76px;border-radius:10px;border:1.5px dashed var(--line2);background:transparent;display:grid;place-items:center;color:var(--muted);font-size:12px;cursor:pointer;text-align:center;line-height:1.3}
.phmsg{font-size:12px;color:var(--muted)}
.phmsg.err{color:var(--danger)}
.elist .thumbs{display:flex;gap:3px;margin-top:3px}
.elist .thumbs img{width:28px;height:28px;border-radius:5px;object-fit:cover}
.galtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.galtools label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.galgroup{margin-bottom:22px}
.galgroup h3{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.galgroup h3 i{width:14px;height:10px;border-radius:3px 6px 4px 7px;display:inline-block}
.galgroup h3 small{color:var(--muted);font-weight:400;font-size:13px}
.galgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.gph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:0;padding:0;background:var(--bg);cursor:pointer}
.gph img{width:100%;height:100%;object-fit:cover;display:block}
.gph .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:12px;text-align:left;line-height:1.3}
.gph .cap b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gph .bar{position:absolute;top:6px;left:6px;width:18px;height:8px;border-radius:2px 5px 3px 6px}
.gph .local{position:absolute;top:5px;right:5px;font-size:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:0 4px}
.lb{display:grid;gap:10px}
.lb img{width:100%;max-height:60vh;object-fit:contain;border-radius:10px;background:var(--bg)}
.lb .meta{font-size:14px}
.lb .meta .sub{color:var(--muted);font-size:13px}
/* admin */
.tablewrap{overflow-x:auto}
table.mem{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
table.mem th,table.mem td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
table.mem th{color:var(--muted);font-weight:500;font-size:12px}
table.mem td.num{font-variant-numeric:tabular-nums;text-align:right}
.pill{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--bg)}
.pill.off{background:#FDE7E7;color:#B42318}
.pill.me{background:var(--pen-soft);color:var(--pen)}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted)}
/* ---- v3: timer popup ---- */
.tlive{border:0;background:none;padding:0;cursor:pointer;color:inherit;font:inherit}
.tpop{position:fixed;inset:0;z-index:55;background:rgba(10,14,22,.5);display:grid;place-items:center;padding:16px}
.tpop[hidden]{display:none}
.tpbox{--prog:0;position:relative;overflow:hidden;background:var(--sheet);border-radius:22px;width:min(420px,100%);padding:20px 22px 22px;display:grid;gap:14px;justify-items:center;box-shadow:0 20px 60px rgba(0,0,0,.25);border:3px solid var(--tc)}
.tpbox::before{content:"";position:absolute;inset:0;background:var(--tc);opacity:calc(var(--prog) * .22);pointer-events:none;transition:opacity 1s linear}
.tpbox > *{position:relative}
.tphead{display:flex;align-items:center;gap:8px;width:100%}
.tphead b{flex:1;font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpcat{border-radius:4px;padding:1px 7px;font-size:13px;color:#1D2433;font-weight:600}
.tpstyles{width:100%;justify-content:center}
.tpstyles button{flex:1;padding:6px 6px;font-size:13px}
.tpface{display:grid;justify-items:center;gap:6px;min-height:250px;align-content:center;width:100%}
.fdig{position:relative;width:100%;height:130px;border-radius:16px;background:var(--bg);overflow:hidden;display:grid;place-items:center}
.fdfill{position:absolute;left:0;top:0;bottom:0;width:0;opacity:.65;transition:width 1s linear}
.fdtime{position:relative;font-variant-numeric:tabular-nums;font-weight:700;font-size:54px;letter-spacing:.02em;line-height:1}
.fdtime.sm{font-size:34px}
.fpie{width:210px;height:210px}
.fsand{width:140px;height:210px}
.stream{animation:sand 0.8s linear infinite}
@keyframes sand{to{stroke-dashoffset:-9}}
@media (prefers-reduced-motion:reduce){.stream{animation:none}.fdfill,.tpbox::before{transition:none}}
.tpinfo{text-align:center;font-size:14px}
.tpinfo span{color:var(--muted);font-size:13px}
.tpgoal{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tpstop{width:100%;border:0;border-radius:14px;background:#E5484D;color:#fff;font-weight:700;font-size:18px;padding:14px}
/* ---- weekly plan ---- */
.notice .primary{background:var(--pen);color:#fff;font-size:13px;border-radius:8px;padding:5px 12px;white-space:nowrap}
.weekplan{margin-bottom:14px}
.theme{font-size:28px;margin:6px 0 4px;line-height:1.2}
.tgbars{display:grid;gap:6px;margin-top:8px}
.tgb{display:grid;grid-template-columns:120px 1fr 150px;gap:10px;align-items:center;font-size:13px}
.tgb span{display:flex;gap:6px;align-items:center}.tgb i{width:10px;height:10px;border-radius:3px}
.tgb small{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.tgtrack{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}.tgtrack div{height:100%;opacity:.85}

.wkrev{font-size:22px;line-height:32px;border:0;padding:0 4px;background:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);border-radius:0;width:100%}
.mbox.wide{width:min(720px,100%)}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0;counter-reset:st;flex-wrap:wrap}
.steps li{counter-increment:st;font-size:12px;color:var(--muted);padding:4px 10px 4px 6px;border-radius:999px;background:var(--bg);display:flex;gap:6px;align-items:center}
.steps li::before{content:counter(st);width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--sheet);font-weight:700;font-size:11px}
.steps li.on{background:var(--ink);color:var(--sheet)}.steps li.on::before{color:var(--ink)}
.steps li.done::before{content:"✓";color:var(--pen)}
.wpinner{min-height:220px}
.tgt{display:grid;gap:6px}
.tgrow{display:grid;grid-template-columns:12px 1fr 90px 140px;gap:8px;align-items:center;font-size:14px}
.tgrow i{width:12px;height:12px;border-radius:3px}.tgrow small{color:var(--muted);font-size:12px}
.wpdays{display:grid;gap:8px}
.wpday{display:grid;grid-template-columns:56px 1fr;gap:4px 8px;align-items:center}
.wpday input{grid-column:2}
.sunc{color:#D14B4B}

async function flush(){
  if(!DB||!cloudReady)return;

  for(const id of ids){
    const body=id==='settings'?S.settings:id[0]==='m'?S.months[id]:id[0]==='y'?S.years[id]:S.weeks[id];if(!body){inflight.delete(id);continue}
    try{await DB.doc(BASE+id).set(clone(body))}

function rememberPreset(b){
  if(!b.text)return;
  const p=S.settings.presets.filter(x=>!(x.text===b.text&&x.cat===b.cat));
  p.unshift({text:b.text,cat:b.cat,tags:[...(b.tags||[])]});
  S.settings.presets=p.slice(0,14);touch('settings');refreshLists();
}
function paint(k,s,e,b){
  s=Math.max(0,Math.min(1440,s));e=Math.max(0,Math.min(1440,e));if(e<=s)return null;
  const d=day(k);const out=[];
  for(const en of d.entries){
    if(en.e<=s||en.s>=e){out.push(en);continue}
    if(en.s<s)out.push({...en,e:s});
    if(en.e>e)out.push({...en,id:en.s<s?uid():en.id,s:e});
  }
  let ne=null;
  if(!b.erase){
    ne={id:b.id||uid(),s,e,cat:b.cat,text:b.text||'',tags:[...(b.tags||[])],note:b.note||'',src:b.src||'manual',photos:[...(b.photos||[])]};if(b.rid){ne.rid=b.rid;ne.edited=!!b.edited}
    if(ne.src==='manual'&&!b.id){
      for(let i=out.length-1;i>=0;i--){const o=out[i];
        if(o.src==='manual'&&o.cat===ne.cat&&o.text===ne.text&&sameTags(o.tags,ne.tags)&&(o.e===ne.s||o.s===ne.e)){
          ne.s=Math.min(ne.s,o.s);ne.e=Math.max(ne.e,o.e);ne.note=[o.note,ne.note].filter(Boolean).join(' / ');ne.photos=[...(o.photos||[]),...ne.photos];ne.id=o.id;out.splice(i,1)}}
    }
    out.push(ne);
  }
  out.sort((a,b2)=>a.s-b2.s);d.entries=out;touch(wkOf(k));
  if(ne&&ne.src==='manual')rememberPreset(b);
  return ne;
}
function allTags(){
  const t=new Set();
  for(const p of S.settings.presets)(p.tags||[]).forEach(x=>t.add(x));
  for(const w of Object.values(S.weeks))for(const d of Object.values(w.days||{}))for(const e of d.entries||[])(e.tags||[]).forEach(x=>t.add(x));
  return [...t].sort();
}

  $('#tagList').innerHTML=allTags().map(t=>`<option value="${esc(t)}">`).join('');
}

/* ---------- tracker ---------- */
function stopTracker(){
  const t=S.settings.tracker;if(!t)return;closeTimerPop();
  const end=Date.now();S.settings.tracker=null;touch('settings');
  if(end-t.start<60000){renderTracker();render();toast('1분이 지나지 않아 기록하지 않았어요');return}
  let cur=t.start,last=null;
  while(cur<end){
    const k=dkey(new Date(cur));const ds=fromKey(k).getTime();const next=addDays(fromKey(k),1).getTime();
    const se=Math.min(end,next);
    const s=Math.floor((cur-ds)/60000),e=Math.ceil((se-ds)/60000);
    const ne=paint(k,s,Math.min(e,1440),{cat:t.cat,text:t.text,tags:t.tags,src:'tracker'});
    if(ne)last={k,id:ne.id};
    cur=se;
  }
  rememberPreset({text:t.text,cat:t.cat,tags:t.tags});
  renderTracker();render();
  toast(`${t.text} ${dur((end-t.start)/60000)} 기록했어요`,'메모·사진 추가',()=>{if(last)openEditor(last.k,last.id)});
}
function renderTracker(){
  const t=S.settings.tracker,el=$('#tracker');
  if(AUTH.state!=='ready'||appBlocked()){el.innerHTML='';return}
  if(!t){el.innerHTML=`<button class="tbtn" id="tStart" title="타이머 열기"><span aria-hidden="true">⏱</span>타이머</button>`;$('#tStart').onclick=openTimerPop;return}

  $('#tStop').onclick=stopTracker;$('#tOpen').onclick=openTimerPop;tickTracker();
}
function tickTracker(){const t=S.settings.tracker,el=$('#tTime');if(!t||!el)return;const s=Math.floor((Date.now()-t.start)/1000);el.textContent=`${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`;drawFace()}

/* ---------- tag box ---------- */
function tagBox(el,arr,onChange){
  function draw(){
    el.innerHTML=arr.map((t,i)=>`<span class="tag">#${esc(t)}<button type="button" data-i="${i}" aria-label="${esc(t)} 태그 삭제">×</button></span>`).join('')+`<input list="tagList" placeholder="${arr.length?'':'태그 입력 후 Enter'}" aria-label="태그 추가">`;
    const inp=el.querySelector('input');
    el.querySelectorAll('button').forEach(b=>b.onclick=()=>{arr.splice(+b.dataset.i,1);onChange&&onChange();draw()});
    const add=()=>{const v=inp.value.replace(/[#,]/g,'').trim();if(v&&!arr.includes(v)){arr.push(v);onChange&&onChange();draw();el.querySelector('input').focus()}else inp.value=''};
    inp.onkeydown=e=>{if(e.isComposing)return;if(e.key==='Enter'||e.key===','){e.preventDefault();add()}else if(e.key==='Backspace'&&!inp.value&&arr.length){arr.pop();onChange&&onChange();draw();el.querySelector('input').focus()}};
    inp.onchange=()=>{if(inp.value.trim())add()};
    inp.onblur=()=>{if(inp.value.trim())add()};
  }
  draw();
}

let MCP,FILEARGS=null;
async function getMcp(){if(MCP!==undefined)return MCP;MCP=null;if(window.claude&&window.claude.use){try{MCP=await window.claude.use('mcp')}catch(e){MCP=null}}return MCP}
function payloadOf(r){

}

    server_unavailable:'Google Drive가 잠시 응답하지 않아요. 잠시 뒤 다시 올려 주세요.',
    capability_disabled:'이 화면에서는 Google Drive를 쓸 수 없어요.',too_big:'파일이 커서 바로 올릴 수 없어요.'}[c])||'Google Drive에 올리지 못했어요.';
}
async function findOrCreateFolder(mcp,title,parent){
  const q=`title = '${title}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false and parentId = '${parent||'root'}'`;
  const r=await mcp.callTool(DRIVE,'search_files',{query:q,pageSize:5,excludeContentSnippets:true},{cache:false});
  const p=payloadOf(r);let f=p&&Array.isArray(p.files)?p.files[0]:null;
  if(!f){const inp={title,contentMimeType:'application/vnd.google-apps.folder'};if(parent)inp.parentId=parent;const c=await mcp.callTool(DRIVE,'create_file',inp);f=payloadOf(c)}

function resetDriveFolders(){S.settings.drivePdsId='';S.settings.drivePdsUrl='';S.settings.drivePhotoId='';touch('settings')}
async function ensureFileArgs(mcp){if(FILEARGS===null){try{const lt=await mcp.listTools();FILEARGS=!!(lt&&lt.fileArgs)}catch(e){FILEARGS=false}}}
async function driveUpload({title,blob,text,mime,folder,keep}){

  await ensureFileArgs(mcp);

  if(keep)input.disableConversionToGoogleType=true;

  else{if(blob.size>700000)throw {code:'too_big'};input.base64Content=await blobToB64(blob)}
  try{const r=await mcp.callTool(DRIVE,'create_file',input);const f=payloadOf(r);if(!f||!f.id)throw {code:'tool_error'};return {id:f.id,url:f.viewUrl||''}}

const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
const dataUrlToBlob=u=>{const [h,b]=u.split(',');const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:(h.match(/data:(.*?);/)||[])[1]||'image/jpeg'})};
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('img'));im.src=u})}
function toCanvas(im,max){const w=im.naturalWidth,h=im.naturalHeight,sc=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return c}
const canvasBlob=(c,q)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
function dataUrlUnder(im,max,limit){let q=.8,m=max;for(let i=0;i<7;i++){const u=toCanvas(im,m).toDataURL('image/jpeg',q);if(u.length<=limit)return u;q=Math.max(.45,q-.08);m=Math.round(m*.85)}return toCanvas(im,280).toDataURL('image/jpeg',.55)}
async function uploadToDrive(blob,title){return driveUpload({title,blob,mime:'image/jpeg',folder:'photos',keep:true})}
async function addPhotoFile(file,ctx,onStatus){
  const im=await loadImg(file);
  const mc=await getMcp();if(mc&&FILEARGS===null){try{const lt=await mc.listTools();FILEARGS=!!(lt&&lt.fileArgs)}catch(e){FILEARGS=false}}
  const pid='p'+uid();
  const thumb=dataUrlUnder(im,420,60000);
  const p={id:pid,date:ctx.date,entryId:ctx.entryId,s:ctx.s,e:ctx.e,cat:ctx.cat,text:ctx.text||'',tags:[...(ctx.tags||[])],createdAt:Date.now(),thumb,driveId:'',driveUrl:'',img:'',name:file.name||'photo.jpg'};

function bindTodos(root,getList,docId,after){
  root.querySelectorAll('.todos li').forEach(li=>{
    const id=li.dataset.id;
    li.querySelector('.chk').onchange=e=>{const t=getList().find(x=>x.id===id);if(t){t.done=e.target.checked;touch(docId);after()}};
    li.querySelector('.x').onclick=()=>{const l=getList();const i=l.findIndex(x=>x.id===id);if(i>=0){l.splice(i,1);touch(docId);after()}};
  });
  const row=root.querySelector('.addrow');const txt=row.querySelector('input[type=text]');const tm=row.querySelector('.ttime');
  const add=()=>{const v=txt.value.trim();if(!v)return;getList(true).push({id:uid(),text:v,done:false,time:tm?tm.value:''});touch(docId);after(true)};
  txt.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();add()}};
  row.querySelector('.add').onclick=add;
}

function segHTML(en,h,extraCls){
  const hs=h*60,he=hs+60;const s=Math.max(en.s,hs),e=Math.min(en.e,he);if(e<=s)return'';
  const c=cat(en.cat);const left=(s-hs)/60*100,w=(e-s)/60*100;
  const showLabel=en.s>=hs||h===0;
  const np=(en.photos||[]).filter(id=>PHOTOS[id]).length;
  const label=showLabel?`<div class="seglabel" style="left:${left}%;max-width:${100-left}%">${esc(en.text||c.name)}${en.src==='tracker'?'<span class="t">⏱</span>':''}${en.note?'<span class="t">✎</span>':''}${en.src==='routine'?'<span class="rt">↻</span>':''}${np?`<span class="phb">📷 ${np}</span>`:''}</div>`:'';
  return `<div class="seg ${extraCls||''}" data-id="${en.id||''}" style="left:${left}%;width:${w}%;background:${c.color}" title="${esc(hm(en.s))}–${esc(hm(en.e))} ${esc(en.text||c.name)}"></div>${label}`;
}
function drawGrid(scrollInit){
  const g=$('#grid');if(!g)return;const k=dkey(UI.date);const d=peekDay(k)||{entries:[]};
  const keep=g.scrollTop;const now=new Date();const isToday=k===todayKey();const nowM=now.getHours()*60+now.getMinutes();
  const t=S.settings.tracker;let live=null;
  if(t){const ds=fromKey(k).getTime(),de=ds+86400000;const st=Math.max(t.start,ds),en=Math.min(Date.now(),de);if(en>st)live={s:Math.floor((st-ds)/60000),e:Math.max(Math.ceil((en-ds)/60000),Math.floor((st-ds)/60000)+1),cat:t.cat,text:t.text+' (진행 중)',src:'tracker'}}
  let html='';
  for(let h=0;h<24;h++){
    let segs='';
    for(const en of d.entries)if(en.s<h*60+60&&en.e>h*60)segs+=segHTML(en,h);
    if(live&&live.s<h*60+60&&live.e>h*60)segs+=segHTML(live,h,'live');
    const cur=isToday&&Math.floor(nowM/60)===h;
    html+=`<div class="row${cur?' cur':''}"><div class="hl">${h}</div><div class="track" data-h="${h}">${segs}${cur?`<div class="nowline" style="left:${nowM%60/60*100}%"></div>`:''}</div></div>`;
  }
  g.innerHTML=html;g.dataset.mode=UI.mode;

/* drag painting */
function cellAt(x,y){
  const g=$('#grid');if(!g)return null;const gr=g.getBoundingClientRect();
  const yy=Math.max(gr.top+1,Math.min(gr.bottom-1,y));
  for(const tr of g.querySelectorAll('.track')){const r=tr.getBoundingClientRect();if(yy>=r.top&&yy<r.bottom+1){let c=Math.floor((x-r.left)/r.width*60);c=Math.max(0,Math.min(59,c));return +tr.dataset.h*60+c}}
  return null;
}
function rangeOf(a,b){const sn=S.settings.snap||10;const lo=Math.min(a,b),hi=Math.max(a,b)+1;return [Math.floor(lo/sn)*sn,Math.min(1440,Math.ceil(hi/sn)*sn)]}
function drawPreview(){
  const g=$('#grid');g.querySelectorAll('.pv').forEach(x=>x.remove());if(!dragging)return;
  const [s,e]=rangeOf(dragging.a,dragging.b);
  for(let h=Math.floor(s/60);h<=Math.floor((e-1)/60);h++){
    const tr=g.querySelector(`.track[data-h="${h}"]`);if(!tr)continue;
    const ss=Math.max(s,h*60),ee=Math.min(e,h*60+60);
    const div=document.createElement('div');div.className='pv'+(UI.mode==='erase'?' erase':'');div.style.left=(ss-h*60)/60*100+'%';div.style.width=(ee-ss)/60*100+'%';tr.appendChild(div);
  }
  const info=$('#dragInfo');if(info)info.textContent=`${UI.mode==='erase'?'지우기':(UI.brush.text||cat(UI.brush.cat).name)} ${hm(s)}–${hm(e)} (${dur(e-s)})`;
}
function autoScroll(){
  if(!dragging)return;const g=$('#grid');const r=g.getBoundingClientRect();const y=dragging.y;let dy=0;
  if(y<r.top+40)dy=-Math.ceil((r.top+40-y)/4);else if(y>r.bottom-40)dy=Math.ceil((y-(r.bottom-40))/4);
  if(dy){g.scrollTop+=Math.max(-20,Math.min(20,dy));const c=cellAt(dragging.x,dragging.y);if(c!=null&&c!==dragging.b){dragging.b=c;drawPreview()}}
  dragging.raf=requestAnimationFrame(autoScroll);
}
main.addEventListener('pointerdown',e=>{
  const g=e.target.closest('#grid');if(!g)return;const tr=e.target.closest('.track');if(!tr)return;
  const k=dkey(UI.date);
  if(UI.mode==='select'){
    const seg=e.target.closest('.seg');
    if(seg&&seg.dataset.id){openEditor(k,seg.dataset.id);return}
    const c=cellAt(e.clientX,e.clientY);if(c==null)return;
    const d=peekDay(k);const m=c;const hit=d&&d.entries.find(x=>x.s<=m&&x.e>m);
    if(hit)openEditor(k,hit.id);else{const s0=Math.floor(c/10)*10;openEditor(k,null,{s:s0,e:Math.min(1440,s0+30)})}
    return;
  }
  if(e.button!==undefined&&e.button!==0)return;
  const c=cellAt(e.clientX,e.clientY);if(c==null)return;
  e.preventDefault();
  dragging={a:c,b:c,id:e.pointerId,x:e.clientX,y:e.clientY};
  try{g.setPointerCapture(e.pointerId)}catch(_){}
  drawPreview();dragging.raf=requestAnimationFrame(autoScroll);
});
main.addEventListener('pointermove',e=>{
  if(!dragging||e.pointerId!==dragging.id)return;e.preventDefault();
  dragging.x=e.clientX;dragging.y=e.clientY;const c=cellAt(e.clientX,e.clientY);
  if(c!=null&&c!==dragging.b){dragging.b=c;drawPreview()}
});
function endDrag(e,cancel){
  if(!dragging||(e&&e.pointerId!==dragging.id))return;
  cancelAnimationFrame(dragging.raf);const dr=dragging;dragging=null;
  const k=dkey(UI.date);
  if(!cancel){
    const [s,en]=rangeOf(dr.a,dr.b);
    if(UI.mode==='erase')paint(k,s,en,{erase:true});
    else paint(k,s,en,{cat:UI.brush.cat,text:UI.brush.text.trim(),tags:UI.brush.tags});
    dr.msg=`${UI.mode==='erase'?'지웠어요':'기록했어요'}: ${hm(s)}–${hm(en)} (${dur(en-s)})`;
  }
  drawGrid();
  if(!cancel&&UI.mode==='paint')redrawBrushKeepFocus();
  const info=$('#dragInfo');if(info&&dr.msg)info.textContent=dr.msg;
}

function renderPhotos(){
  const G=UI.gal;const now=new Date();
  let list=Object.values(PHOTOS);
  if(G.cat)list=list.filter(p=>p.cat===G.cat);
  if(G.range!=='all'){let from;if(G.range==='week')from=dkey(monday(now));else if(G.range==='month')from=dkey(new Date(now.getFullYear(),now.getMonth(),1));else from=dkey(new Date(now.getFullYear(),0,1));list=list.filter(p=>p.date>=from)}
  const key=p=>p.date+pad(Math.floor((p.s||0)/60))+pad((p.s||0)%60)+String(p.createdAt||0).padStart(14,'0');
  list.sort((a,b)=>G.sort==='desc'?(key(a)<key(b)?1:-1):(key(a)>key(b)?1:-1));
  const groups=[];const gmap={};
  const push=(gk,label,p,color)=>{if(!gmap[gk]){gmap[gk]={label,items:[],color};groups.push(gmap[gk])}gmap[gk].items.push(p)};
  for(const p of list){
    if(G.group==='day')push(p.date,kDate(p.date)+' '+fromKey(p.date).getFullYear(),p);
    else if(G.group==='month'){const d=fromKey(p.date);push(p.date.slice(0,7),`${d.getFullYear()}년 ${d.getMonth()+1}월`,p)}
    else if(G.group==='cat'){const c=cat(p.cat);push('c'+p.cat,c.name,p,c.color)}
    else if(G.group==='tag'){const ts=(p.tags&&p.tags.length)?p.tags:['(태그 없음)'];ts.forEach(t=>push('t'+t,t==='(태그 없음)'?t:'#'+t,p))}
    else push('all','',p);
  }
  if(G.group==='cat')groups.sort((a,b)=>{const ia=S.settings.cats.findIndex(c=>c.name===a.label),ib=S.settings.cats.findIndex(c=>c.name===b.label);return (ia<0?99:ia)-(ib<0?99:ib)});
  if(G.group==='tag')groups.sort((a,b)=>b.items.length-a.items.length);

  main.innerHTML=`${noticeHTML()}
   <section class="dayhead"><div class="dtitle">사진첩<small>시간 기록에 붙인 사진 ${total}장${S.settings.drivePdsUrl?` | <a href="${esc(S.settings.drivePdsUrl)}" target="_blank" rel="noopener">Google Drive DDD Diary 폴더 열기</a>`:''}</small></div></section>
   <div class="galtools">
     <label>정렬 ${sel('gSort',[['desc','최신순'],['asc','오래된순']],G.sort)}</label>
     <label>묶어 보기 ${sel('gGroup',[['day','날짜별'],['month','월별'],['cat','카테고리별'],['none','묶지 않기']],G.group)}</label>
     <label>카테고리 ${sel('gCat',[['','전체'],...S.settings.cats.map(c=>[c.id,esc(c.name)])],G.cat)}</label>
     <label>기간 ${sel('gRange',[['all','전체'],['week','이번 주'],['month','이번 달'],['year','올해']],G.range)}</label>
   </div>
   ${localN?`<p class="hint">아직 Google Drive에 올라가지 않은 사진이 ${localN}장 있어요. 사진을 눌러 다시 올릴 수 있어요.</p>`:''}
   ${list.length?groups.map(g=>`<section class="galgroup">${g.label?`<h3>${g.color?`<i style="background:${g.color}"></i>`:''}${esc(g.label)}<small>${g.items.length}장</small></h3>`:''}<div class="galgrid">${g.items.map(p=>{const c=cat(p.cat);return `<button class="gph" data-p="${p.id}" aria-label="${esc(p.text||c.name)} 사진 보기"><img src="${photoSrc(p)}" alt="" loading="lazy"><span class="bar" style="background:${c.color}"></span>${p.driveId?'':'<span class="local">Drive 대기</span>'}<span class="cap"><b>${esc(p.text||c.name)}</b>${G.group==='day'?'':kDate(p.date)+' '}${hm(p.s||0)}</span></button>`}).join('')}</div></section>`).join('')
   :`<div class="sheet empty">${total?'조건에 맞는 사진이 없어요. 필터를 바꿔 보세요.':'아직 사진이 없어요. 하루 화면에서 칠한 기록을 누른 뒤 사진을 추가해 보세요.'}</div>`}`;
  bindNotice();

/* ---------- plan vs actual (v6) ---------- */
const catIn=cats=>id=>(cats||S.settings.cats).find(c=>c.id===id)||{id,name:'(삭제된 카테고리)',color:'#C2C8D0'};
function planCompare(tg,by,cats){
  tg=tg||{};by=by||{};const list=cats||S.settings.cats;
  const ids=[...new Set([...Object.keys(tg).filter(c=>tg[c]>0),...Object.keys(by).filter(c=>by[c]>0)])];
  const order=id=>{const i=list.findIndex(x=>x.id===id);return i<0?99:i};ids.sort((a,b)=>order(a)-order(b));
  let mn=0,mx=0,sT=0,sA=0,sAp=0;
  const rows=ids.map(c=>{const t=tg[c]||0,a=by[c]||0;if(t>0){mn+=Math.min(a,t);mx+=Math.max(a,t);sAp+=a}sT+=t;sA+=a;return {c,t,a}});
  return {rows,match:mx?Math.round(mn/mx*100):null,sT,sA,sAp,max:Math.max(1,...rows.map(r=>Math.max(r.t,r.a)))};
}
function pcStatus(t,a){if(!t)return ['계획 없음','none'];const r=a/t;if(r>=0.9&&r<=1.1)return ['계획대로','ok'];if(r<0.9)return [`${dur(t-a)} 부족`,'low'];return [`${dur(a-t)} 초과`,'over']}
function ringSVG(p){const c=p>=80?'#2FA86B':p>=50?'#F0A33A':'#E5484D';const L=2*Math.PI*34;return `<svg viewBox="0 0 84 84" class="pcring" aria-hidden="true"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--bg)" stroke-width="11"/><circle cx="42" cy="42" r="34" fill="none" stroke="${c}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${(Math.min(100,p)/100*L).toFixed(1)} ${L.toFixed(1)}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink)">${p}%</text></svg>`}
function compareHTML(pc,cats){
  if(!pc.rows.some(r=>r.t>0))return '';const cf=catIn(cats);
  return `<div class="pcwrap"><div class="pcsum">${ringSVG(pc.match||0)}<div><b>계획과 실행 일치도 ${pc.match}%</b>
    <p>계획한 시간 <b>${dur(pc.sT)}</b>, 그 카테고리에서 실행한 시간 <b>${dur(pc.sAp)}</b> (계획 대비 ${pc.sT?Math.round(pc.sAp/pc.sT*100):0}%)</p>
    <p class="hint" style="margin:0">일치도는 카테고리마다 계획과 실행 중 작은 쪽을 큰 쪽으로 나눠 합친 값이에요. 모자라도, 넘쳐도 낮아지고 계획대로면 100%예요.</p></div></div>
   <div class="pclegend"><span><i class="lg-plan"></i>계획</span><span><i class="lg-do"></i>실행</span></div>
   <div class="pcrows">${pc.rows.map(r=>{const c=cf(r.c);const [st,cls]=pcStatus(r.t,r.a);const pct=r.t?Math.round(r.a/r.t*100):null;
     return `<div class="pcrow"><div class="pchd"><span><i style="background:${c.color}"></i>${esc(c.name)}</span><span class="pcst ${cls}">${pct==null?'':`<b>${pct}%</b> `}${st}</span></div>
       <div class="pcbars"><div class="pcb plan" style="width:${r.t/pc.max*100}%;--c:${c.color}"></div><div class="pcb do" style="width:${Math.max(r.a?1:0,r.a/pc.max*100)}%;background:${c.color}"></div></div>
       <div class="pcnum">계획 ${r.t?dur(r.t):'–'} | 실행 ${dur(r.a)}</div></div>`}).join('')}</div></div>`;
}

  if(!(AUTH.canEdit||AUTH.isOwner)){el.innerHTML=`<div class="sheet empty">중간 관리자로 지정된 뒤 다시 로그인하면 학생 기록 요약을 볼 수 있어요. 계속 안 보이면 관리자에게 확인해 주세요.</div>`;return}
  const wk='w'+dkey(monday(new Date()));const list=CLASS.members.slice().sort((a,b)=>(a.nickname||'').localeCompare(b.nickname||'','ko'));
  let n=0,sumRate=0,rateN=0,sumMin=0,matchN=0,sumMatch=0;
  const rows=list.map(m=>{const r=CLASS.reports[m.id];const w=r&&r.weeks&&r.weeks[wk];const ok=m.share&&m.share.ok&&r;
    if(w){n++;sumMin+=w.tot;if(w.todos){sumRate+=w.done/w.todos;rateN++}if(w.match!=null){sumMatch+=w.match;matchN++}}
    return `<tr><td><b>${esc(m.nickname||'–')}</b></td><td>${esc([m.school,m.cls].filter(Boolean).join(' '))}</td><td>${fmtDate(m.lastActive)}</td>
      ${ok?`<td class="num">${w?dur(w.tot):'–'}</td><td class="num">${w&&w.todos?`${w.done}/${w.todos} (${Math.round(w.done/w.todos*100)}%)`:'–'}</td><td class="num">${w&&w.goals.length?`${w.goals.filter(g=>g.d).length}/${w.goals.length}`:'–'}</td><td class="num">${w&&w.match!=null?w.match+'%':'–'}</td>`:`<td colspan="4" class="muted">${m.share&&m.share.ok?'아직 보낸 요약이 없어요':'요약 공유를 허락하지 않았어요'}</td>`}
      <td><button class="ghost" data-st="${m.id}">자세히</button></td></tr>`}).join('');
  const pend=list.filter(m=>memberStatus(m)==='wait'||memberStatus(m)==='rej');
  el.innerHTML=`${pend.length?`<section class="sheet" style="margin-bottom:14px"><h2>가입 승인<small>${pend.filter(m=>memberStatus(m)==='wait').length}명 대기</small></h2><div class="tablewrap"><table class="mem"><thead><tr><th>이름</th><th>아이디</th><th>소속/반</th><th>신청일</th><th>승인</th></tr></thead><tbody>${pend.map(m=>`<tr><td><b>${esc(m.nickname||'')}</b></td><td>${esc(m.loginId||'')}</td><td>${esc([m.school,m.cls].filter(Boolean).join(' '))}</td><td>${fmtDate(m.joinedAt)}</td><td>${apprCell(m)}</td></tr>`).join('')}</tbody></table></div></section>`:''}<div class="kpis"><div class="kpi"><span>학생 수</span><b>${list.length}명</b><span>이번 주 기록한 학생 ${n}명</span></div><div class="kpi"><span>이번 주 하루 계획 실행률</span><b>${rateN?Math.round(sumRate/rateN*100)+'%':'–'}</b><span>학생 평균</span></div><div class="kpi"><span>이번 주 기록 시간</span><b>${n?dur(sumMin/n):'–'}</b><span>학생 평균</span></div><div class="kpi"><span>계획·실행 일치도</span><b>${matchN?Math.round(sumMatch/matchN)+'%':'–'}</b><span>주간 계획 세운 학생 평균</span></div></div>
   <section class="sheet">${list.length?`<div class="tablewrap"><table class="mem"><thead><tr><th>이름</th><th>소속/반</th><th>최근 접속</th><th class="num">이번 주 기록</th><th class="num">하루 계획 실행</th><th class="num">주간 목표</th><th class="num">일치도</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">아직 담당 학생이 없어요. 학생이 가입할 때 담당 선생님으로 고르거나, 관리자가 지정하면 여기에 나타나요.</div>'}
   <p class="hint" style="margin-top:10px">학생이 허락한 요약만 보여요. 학생의 하루 기록 원본과 사진은 볼 수 없어요.</p></section>`;
  el.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>openStudent(CLASS.members.find(m=>m.id===b.dataset.st)));
  bindApprovals(el);
}
async function openStudent(m){
  if(!m)return;const r=CLASS.reports[m.id];const ok=m.share&&m.share.ok&&r;const wk='w'+dkey(monday(new Date()));const me=managerOf(AUTH.id)||{};
  let body='';
  if(!ok)body=`<p class="hint">${m.share&&m.share.ok?'아직 이 학생이 보낸 기록 요약이 없어요. 학생이 다이어리를 쓰면 자동으로 올라와요.':'이 학생은 기록 요약 공유를 허락하지 않았어요.'}</p>`;
  else{const cf=catIn(r.cats);const wks=Object.keys(r.weeks||{}).sort().reverse().slice(0,4);
    body=wks.map(k=>{const w=r.weeks[k];const mon=fromKey(k.slice(1)),sun=addDays(mon,6);const pc=planCompare(w.targets,w.by,r.cats);
      const bars=Object.entries(w.by||{}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);const mx=bars.length?bars[0][1]:1;
      return `<section class="stuwk"><div class="cbh"><b>${mon.getMonth()+1}월 ${mon.getDate()}일 – ${sun.getMonth()+1}월 ${sun.getDate()}일</b><span>기록 ${dur(w.tot)} | 하루 계획 ${w.done}/${w.todos}${w.match!=null?` | 일치도 ${w.match}%`:''}</span></div>
        ${w.theme?`<p class="ctheme hand">${esc(w.theme)}</p>`:''}
        ${w.goals.length?`<ul class="ctodo">${w.goals.map(g=>`<li class="${g.d?'on':''}"><span class="ccbox">${g.d?'✓':''}</span><span>${esc(g.t)}</span></li>`).join('')}</ul>`:''}
        ${pc.rows.some(x=>x.t>0)?compareHTML(pc,r.cats):`<div class="cbars">${bars.map(([c,v])=>`<div class="cbar"><div class="cbt"><span><i style="background:${cf(c).color}"></i>${esc(cf(c).name)}</span><b>${dur(v)}</b></div><div class="cbtrack"><div style="width:${Math.max(2,v/mx*100)}%;background:${cf(c).color}"></div></div></div>`).join('')}</div>`}
        ${w.review?`<div class="cbrow"><span class="cbl">주간 회고</span><div class="ctext hand">${esc(w.review)}</div></div>`:''}</section>`}).join('')||'<p class="hint">최근 기록이 없어요.</p>';
    if((r.see||[]).length)body+=`<h3 class="subh">최근 하루 회고</h3>${r.see.map(x=>`<div class="cbrow"><span class="cbl">${kShort(x.k)}</span><div class="ctext hand">${esc(x.t)}</div></div>`).join('')}`;
  }
  const box=openModal(`<h3>${esc(m.nickname||'')} <small style="font-weight:400;color:var(--muted);font-size:13px">${esc([m.school,m.cls].filter(Boolean).join(' '))} | 최근 접속 ${fmtDate(m.lastActive)}</small></h3>
    <div class="stubody">${body}</div>
    <label class="field"><span>이번 주 선생님 한마디 <small>학생의 한 주 화면에 보여요</small></span><textarea id="fbText" rows="3" placeholder="예: 이번 주 계획을 잘 지켰어요!"></textarea></label>
    <p class="phmsg" id="fbMsg"></p>
    <div class="mfoot">${m.loginId?`<button class="ghost" data-pr="${m.id}">비밀번호 초기화 허용</button>`:''}<span class="sp"></span><button class="ghost" data-x>닫기</button><button class="primary" id="fbSave">한마디 남기기</button></div>`);
  bindApprovals(box);
  box.classList.add('wide');
  const ref=DB.doc(`feedback/${m.id}/notes/${wk}`);
  try{const d=await ref.get();if(d.exists&&$('#fbText'))$('#fbText').value=(d.data()||{}).text||''}catch(e){}
  $('#fbSave').onclick=async()=>{const t=$('#fbText').value.trim();try{if(t)await ref.set({text:t,by:managerLabel(me)||'담당 선생님',at:Date.now()});else await ref.delete();$('#fbMsg').textContent=t?'한마디를 남겼어요.':'한마디를 지웠어요.'}catch(e){$('#fbMsg').textContent='저장하지 못했어요. 중간 관리자로 지정돼 있는지 확인해 주세요.'}};
}

function drawInvites(){
  const el=$('#ivList');if(!el)return;const inv=ADMIN.invites||{};const codes=Object.keys(inv).sort((a,b)=>(inv[b].createdAt||0)-(inv[a].createdAt||0));

    return `<tr><td><code class="ivcode">${c}</code></td><td>${esc(v.name)}</td><td>${v.role==='manager'?'<span class="pill me">중간 관리자</span>':'<span class="pill">학생</span>'}</td><td>${esc([v.school,v.cls].filter(Boolean).join(' '))}</td><td>${esc(managerLabel(managerOf(v.managerId)))}</td><td>${used?`<span class="pill ok">가입함</span> ${esc(used.nickname||'')}`:'<span class="pill">가입 전</span>'}</td><td><button class="ghost" data-cp="${c}">복사</button> <button class="ghost danger" data-ivd="${c}">삭제</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">아직 만든 초대 코드가 없어요.</div>';
  el.querySelectorAll('[data-cp]').forEach(b=>b.onclick=async()=>{const c=b.dataset.cp;const v=inv[c];const t=`DDD Diary 초대 코드: ${c}\n${v.name}님, 이 페이지에서 가입할 때 초대 코드에 ${c}를 넣어 주세요.`;try{await navigator.clipboard.writeText(t);toast('초대 안내를 복사했어요')}catch(e){toast(`초대 코드: ${c}`)}});
  el.querySelectorAll('[data-ivd]').forEach(b=>b.onclick=async()=>{if(!confirm('이 초대 코드를 삭제할까요? 이미 가입한 회원은 그대로 남아요.'))return;const n=Object.assign({},ADMIN.invites);delete n[b.dataset.ivd];if(await saveAdminCfg({invites:n}))drawInvites()});

async function drawMembers(){
  const el=$('#memTable');if(!el)return;
  const mg=(ADMIN.managers||[]).slice();let ch=false;
  for(const m of MEMBERS)if(m.role==='manager'&&m.inviteCode&&((ADMIN.invites||{})[m.inviteCode]||{}).role==='manager'&&!mg.find(x=>x.id===m.id)&&!(ADMIN.mgrRemoved||[]).includes(m.id)){mg.push({id:m.id,name:(m.nickname||'')+' 선생님',school:m.school||'',cls:m.cls||''});ch=true}
  if(ch)await saveAdminCfg({managers:mg});
  const mgrs=ADMIN.managers||[];
  const list=[...MEMBERS].sort((a,b)=>((memberStatus(b)==='wait')-(memberStatus(a)==='wait'))||(b.lastActive||0)-(a.lastActive||0));
  const susp=new Set(ADMIN.suspended||[]);const weekAgo=Date.now()-7*864e5;

/* ---------- weekly planning ---------- */
function weekStats(mon){const w=S.weeks['w'+dkey(mon)]||{goals:[],days:{}};let tot=0,by={},done=0,todos=0;
  for(let i=0;i<7;i++){const d=(w.days||{})[dkey(addDays(mon,i))];if(!d)continue;for(const e of d.entries||[]){tot+=e.e-e.s;by[e.cat]=(by[e.cat]||0)+e.e-e.s}todos+=(d.todos||[]).length;done+=(d.todos||[]).filter(t=>t.done).length}
  const g=w.goals||[];return {tot,by,done,todos,goalsDone:g.filter(x=>x.done).length,goalsN:g.length,top:Object.entries(by).sort((a,b)=>b[1]-a[1])}}
function weekBanner(){
  const wk='w'+dkey(monday(new Date()));const w=S.weeks[wk];if(w&&w.planAt)return'';
  let dis='';try{dis=localStorage.getItem('pds-wp-dismiss')||''}catch(e){}if(dis===wk)return'';
  return `<div class="notice"><b>이번 주</b><span>아직 주간 계획을 세우지 않았어요. 지난 주를 돌아보고 이번 주 목표와 시간 배분을 정해 보세요.</span><button class="primary" id="wpBanner">주간 계획 세우기</button><button id="wpBannerX" aria-label="닫기">×</button></div>`;
}
function bindWeekBanner(){const b=$('#wpBanner');if(b)b.onclick=()=>openWeekPlan(monday(new Date()));const x=$('#wpBannerX');if(x)x.onclick=()=>{try{localStorage.setItem('pds-wp-dismiss','w'+dkey(monday(new Date())))}catch(e){}x.parentNode.remove()}}
function openWeekPlan(mon){
  const wk='w'+dkey(mon);const w=week(wk);const pmon=addDays(mon,-7),pwk='w'+dkey(pmon);const pw=S.weeks[pwk]||{goals:[],days:{}};
  const ls=weekStats(pmon);const sun=addDays(mon,6);
  const draft={theme:w.theme||'',goals:clone(w.goals||[]),targets:Object.assign({},w.targets||{}),prevReview:pw.review||'',days:{}};
  for(let i=0;i<7;i++){const k=dkey(addDays(mon,i));draft.days[k]=clone((peekDay(k)||{todos:[]}).todos||[])}
  let step=0;const STEPS=['지난 주 회고','다짐과 목표','시간 배분','요일별 할 일'];
  const box=openModal('<div id="wpBody"></div>');box.classList.add('wide');
  function draw(){
    const b=$('#wpBody');if(!b)return;let inner='';
    if(step===0)inner=`<div class="mini-stats"><div><span>지난 주 기록</span><b>${hrs(ls.tot)}시간</b></div><div><span>계획 실행률</span><b>${ls.todos?Math.round(ls.done/ls.todos*100)+'%':'–'}</b></div><div><span>주간 목표 달성</span><b>${ls.goalsDone}/${ls.goalsN}</b></div></div>
      ${ls.top.length?`<div class="legend">${ls.top.slice(0,6).map(([c,m])=>`<span><i style="background:${cat(c).color}"></i>${esc(cat(c).name)} <b>${dur(m)}</b></span>`).join('')}</div>`:'<p class="hint">지난 주 기록이 없어요.</p>'}
      ${(pw.goals||[]).length?`<ul class="todos" style="margin-top:8px">${pw.goals.map(g=>`<li class="${g.done?'done':''}"><span>${g.done?'✔':'○'}</span><span class="tt">${esc(g.text)}</span></li>`).join('')}</ul>`:''}
      <label class="field" style="margin-top:10px"><span>지난 주 회고 (잘한 점, 아쉬운 점, 이번 주에 바꿀 것)</span><textarea id="wpPrev" rows="4">${esc(draft.prevReview)}</textarea></label>`;
    else if(step===1)inner=`<label class="field"><span>이번 주 다짐 한 줄</span><input id="wpTheme" maxlength="80" value="${esc(draft.theme)}" placeholder="예: 아침 2시간은 나를 위해 쓴다"></label>
      <div class="field"><span>이번 주 목표</span><ul class="todos" id="wpGoals">${draft.goals.map((g,i)=>`<li><span class="tt">${esc(g.text)}</span><button class="x" data-i="${i}" aria-label="삭제">×</button></li>`).join('')}</ul><div class="addrow"><input type="text" id="wpGoalIn" placeholder="목표 입력 후 Enter"><button class="ghost" id="wpGoalAdd">+</button></div></div>`;
    else if(step===2){let sum=0;Object.values(draft.targets).forEach(v=>sum+=v);
      const hOpt=v=>Array.from({length:25},(_,h)=>`<option value="${h}" ${h===v?'selected':''}>${h}</option>`).join('');
      const mOpt=v=>[0,10,20,30,40,50].map(x=>`<option value="${x}" ${x===v?'selected':''}>${pad(x)}</option>`).join('');
      inner=`<p class="hint">카테고리마다 하루에 쓸 시간과 분을 고르면 일주일(×7일) 목표 시간이 계산돼요. 한 주 동안 실제 기록과 비교해 보여드려요.</p>
      <div class="tgt">${S.settings.cats.map(c=>{const dm=Math.round((draft.targets[c.id]||0)/7/10)*10;return `<div class="tgrow"><i style="background:${c.color}"></i><span>${esc(c.name)}</span><span class="tgin">하루 <select data-h="${c.id}" aria-label="${esc(c.name)} 시간">${hOpt(Math.floor(dm/60))}</select>시간 <select data-mm="${c.id}" aria-label="${esc(c.name)} 분">${mOpt(dm%60)}</select>분</span><b class="tgw" data-w="${c.id}">= 주 ${dur(draft.targets[c.id]||0)}</b><small>지난 주 하루 평균 ${dur((ls.by[c.id]||0)/7)}</small></div>`}).join('')}</div>
      <p class="rate" id="wpSum">하루 합계 <b>${dur(sum/7)}</b> / 24시간 | 일주일 합계 <b>${dur(sum)}</b> / 168시간</p>`}
    else inner=`<p class="hint">요일마다 꼭 할 일을 적어 두세요. 하루 화면의 Plan에 그대로 들어가요.</p>
      <div class="wpdays">${Object.keys(draft.days).map((k,i)=>`<div class="wpday"><b class="${i===6?'sunc':''}">${DOW[i]} ${fromKey(k).getDate()}</b><div class="chips">${draft.days[k].map((t,j)=>`<span class="tag">${esc(t.text)}<button data-k="${k}" data-j="${j}" aria-label="삭제">×</button></span>`).join('')}</div><input type="text" data-k="${k}" placeholder="할 일 입력 후 Enter"></div>`).join('')}</div>`;
    b.innerHTML=`<h3>주간 계획 세우기 <small style="font-weight:400;color:var(--muted);font-size:13px">${mon.getMonth()+1}.${mon.getDate()} 월 – ${sun.getMonth()+1}.${sun.getDate()} 일</small></h3>
      <ol class="steps">${STEPS.map((s,i)=>`<li class="${i===step?'on':i<step?'done':''}">${s}</li>`).join('')}</ol>
      <div class="wpinner">${inner}</div>
      <div class="mfoot">${step?'<button class="ghost" id="wpPrevB">이전</button>':''}<span class="sp"></span><button class="ghost" id="wpClose">닫기</button><button class="primary" id="wpNext">${step<3?'다음':'계획 저장'}</button></div>`;
    $('#wpClose').onclick=closeModal;
    if(step===0)$('#wpPrev').oninput=e=>draft.prevReview=e.target.value;
    if(step===1){$('#wpTheme').oninput=e=>draft.theme=e.target.value;const add=()=>{const v=$('#wpGoalIn').value.trim();if(!v)return;draft.goals.push({id:uid(),text:v,done:false});draw();$('#wpGoalIn').focus()};$('#wpGoalIn').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();add()}};$('#wpGoalAdd').onclick=add;b.querySelectorAll('#wpGoals .x').forEach(x=>x.onclick=()=>{draft.goals.splice(+x.dataset.i,1);draw()})}
    if(step===2){const upd2=c=>{const h=+b.querySelector(`[data-h="${c}"]`).value,mm=+b.querySelector(`[data-mm="${c}"]`).value;const d=Math.min(1440,h*60+mm);if(d>0)draft.targets[c]=d*7;else delete draft.targets[c];b.querySelector(`[data-w="${c}"]`).textContent=`= 주 ${dur(draft.targets[c]||0)}`;let t=0;Object.values(draft.targets).forEach(x=>t+=x);$('#wpSum').innerHTML=`하루 합계 <b>${dur(t/7)}</b> / 24시간 | 일주일 합계 <b>${dur(t)}</b> / 168시간`};
      b.querySelectorAll('[data-h],[data-mm]').forEach(sel=>sel.onchange=()=>upd2(sel.dataset.h||sel.dataset.mm))}
    if(step===3){b.querySelectorAll('input[data-k]').forEach(inp=>inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();const v=inp.value.trim();if(!v)return;const k=inp.dataset.k;draft.days[k].push({id:uid(),text:v,done:false,time:''});draw();const n=$(`#wpBody input[data-k="${k}"]`);n&&n.focus()}});b.querySelectorAll('.tag button').forEach(x=>x.onclick=()=>{draft.days[x.dataset.k].splice(+x.dataset.j,1);draw()})}
    if($('#wpPrevB'))$('#wpPrevB').onclick=()=>{step--;draw()};

      const W=week(wk);W.theme=draft.theme.trim();W.goals=draft.goals;W.targets=draft.targets;W.planAt=Date.now();
      for(const [k,list] of Object.entries(draft.days)){if(list.length||peekDay(k))day(k).todos=list}
      touch(wk);closeModal();render();toast('주간 계획을 저장했어요');
    };
  }
  draw();
}

/* ---------- routines (반복 일과) ---------- */
function routineSegments(r,mon){
  const out=[];const crosses=r.e<=r.s;const sun=addDays(mon,6);
  for(let i=-1;i<7;i++){const d=addDays(mon,i),k=dkey(d);
    if(!(r.days||[]).includes(dowIdx(d)))continue;if(r.from&&k<r.from)continue;if(r.to&&k>r.to)continue;
    const segs=crosses?[[k,r.s,1440],[dkey(addDays(d,1)),0,r.e]]:[[k,r.s,r.e]];
    for(const [kk,s,e] of segs){if(e<=s)continue;const dd=fromKey(kk);if(dd<mon||dd>sun)continue;out.push({k:kk,s,e})}}
  return out;
}
function fillGaps(k,s,e,r){const d=day(k);const occ=d.entries.filter(x=>x.e>s&&x.s<e).sort((a,b)=>a.s-b.s);let cur=s;const add=[];
  for(const o of occ){if(o.s>cur)add.push([cur,Math.min(o.s,e)]);cur=Math.max(cur,o.e);if(cur>=e)break}if(cur<e)add.push([cur,e]);
  for(const [a,z] of add)if(z>a)d.entries.push({id:uid(),s:a,e:z,cat:r.cat,text:r.text,tags:[],note:'',src:'routine',rid:r.id,photos:[]});
  d.entries.sort((x,y)=>x.s-y.s);return add.length}
function applyRoutines(mon,onlyId){
  const rs=(S.settings.routines||[]).filter(r=>r.on!==false);if(!rs.length)return 0;
  const wk='w'+dkey(mon);const w=week(wk);w.routineApplied=w.routineApplied||{};let n=0,ch=false;
  for(const r of rs){if(onlyId&&r.id!==onlyId)continue;if(!onlyId&&w.routineApplied[r.id])continue;
    for(const g of routineSegments(r,mon))n+=fillGaps(g.k,g.s,g.e,r);w.routineApplied[r.id]=1;ch=true}
  if(ch)touch(wk);return n;
}
function removeRoutineEntries(mon,rid,fromKeyStr){
  const wk='w'+dkey(mon);const w=S.weeks[wk];if(!w)return;let ch=false;
  for(const [k,d] of Object.entries(w.days||{})){if(fromKeyStr&&k<fromKeyStr)continue;const before=(d.entries||[]).length;d.entries=(d.entries||[]).filter(e=>!(e.src==='routine'&&e.rid===rid&&!e.edited));if(d.entries.length!==before)ch=true}
  if(ch)touch(wk);
}
let lastRoutineMon='';
function checkRoutines(){const mon=monday(new Date());const key=dkey(mon);const n=applyRoutines(mon);if(lastRoutineMon&&lastRoutineMon!==key&&n)toast('반복 일과를 이번 주에 반영했어요');lastRoutineMon=key;return n}
const DAYSETS=[['매일',[0,1,2,3,4,5,6]],['평일',[0,1,2,3,4]],['주말',[5,6]]];
function routineDesc(r){const ds=(r.days||[]).slice().sort();const set=DAYSETS.find(([,a])=>a.join()===ds.join());return `${set?set[0]:ds.map(i=>DOW[i]).join(' ')} ${hm(r.s)}–${r.e<=r.s?'다음 날 ':''}${hm(r.e%1440===0&&r.e?1440:r.e)}`}

function mdoc(id){return S.months[id]||(S.months[id]={theme:'',goals:[],events:[],review:''})}
function ydoc(id){return S.years[id]||(S.years[id]={theme:'',goals:[],focus:{},lookback:'',review:''})}
function monthStats(y,m){const first=new Date(y,m,1),last=new Date(y,m+1,0);let mins=0,done=0,todos=0,days=0;const by={};
  eachDay(first,last,(k,d)=>{if(!d)return;let t=0;for(const e of d.entries||[]){t+=e.e-e.s;by[e.cat]=(by[e.cat]||0)+e.e-e.s}mins+=t;if(t||devText(d))days++;todos+=(d.todos||[]).length;done+=(d.todos||[]).filter(x=>x.done).length});
  let wg=0,wgd=0,wp=0,wn=0;for(let mon=monday(first);mon<=last;mon=addDays(mon,7)){if(mon<first)continue;wn++;const w=S.weeks['w'+dkey(mon)];if(!w)continue;if(w.planAt)wp++;wg+=(w.goals||[]).length;wgd+=(w.goals||[]).filter(g=>g.done).length}
  const M=S.months[`m${y}-${pad(m+1)}`]||{goals:[]};return {mins,done,todos,days,by,wg,wgd,wp,wn,mg:(M.goals||[]).length,mgd:(M.goals||[]).filter(g=>g.done).length}}

const SHEETS='Google Sheets',SHEET_TITLE='DDD 회원 명단';
const SHEET_HEAD=['이름','아이디','소속','반','역할','담당 선생님','승인 상태','가입일','최근 접속','기록 수'];
let sheetT=null,sheetHash='',sheetBusy=false;

async function memberSheetId(mcp){
  if(S.settings.memberSheetId)return S.settings.memberSheetId;
  const pds=await drivePds(mcp);
  const r=await mcp.callTool(DRIVE,'search_files',{query:`title = '${SHEET_TITLE}' and parentId = '${pds}' and trashed = false`,pageSize:5,excludeContentSnippets:true},{cache:false});
  const p=payloadOf(r);let f=p&&Array.isArray(p.files)?p.files.find(x=>x.mimeType==='application/vnd.google-apps.spreadsheet'):null;
  if(!f){const c=await driveUpload({title:SHEET_TITLE,text:SHEET_HEAD.join(','),mime:'text/csv',folder:'pds'});f={id:c.id,viewUrl:c.url}}
  S.settings.memberSheetId=f.id;S.settings.memberSheetUrl=f.viewUrl||'';touch('settings');return f.id;
}
async function syncSheet(manual){
  if(sheetBusy)return;const msg=$('#shMsg');const say=(t,bad)=>{if(msg){msg.className='phmsg'+(bad?' err':'');msg.textContent=t}};
  const mcp=await getMcp();if(!mcp){say(driveErr({code:'capability_disabled'}),true);return}
  const rows=sheetRows();const h=JSON.stringify(rows);if(!manual&&h===sheetHash)return;
  sheetBusy=true;say('Google 시트에 저장하는 중…');
  for(let attempt=0;attempt<2;attempt++){
    try{const id=await memberSheetId(mcp);
      await mcp.callTool(SHEETS,'batch_clear_values',{spreadsheetId:id,ranges:['A2:Z5000']});
      await mcp.callTool(SHEETS,'update_values',{spreadsheetId:id,range:`A1:J${rows.length+1}`,values:[SHEET_HEAD,...rows]});
      sheetHash=h;S.settings.sheetSyncedAt=Date.now();touch('settings');say(`${rows.length}명을 저장했어요 (${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})})`);
      const a=$('#shOpen');if(a&&S.settings.memberSheetUrl){a.href=S.settings.memberSheetUrl;a.hidden=false}break}
    catch(e){if(attempt===0&&e&&e.code==='tool_error'&&S.settings.memberSheetId){S.settings.memberSheetId='';S.settings.memberSheetUrl='';continue}say(driveErr(e),true);break}}
  sheetBusy=false;
}

function formYearPlan(y){return {title:`${y}년 월별 계획`,html:`<h1 class="ph1">Yearly Plan <small>${y}년 월별 계획</small></h1>
  <div class="fyplan">${Array.from({length:12},(_,m)=>`<div><div class="fyh"><b>${m+1}월</b><span>달성 ____ %</span></div><div class="fyl">초점</div>${flines(1,20)}${fchecks(4,19)}<div class="fstar">자기 평가 ○ ○ ○ ○ ○</div></div>`).join('')}</div>`}}
function formTracker(y){let g='<div></div>'+Array.from({length:31},(_,i)=>`<div class="fth">${i+1}</div>`).join('');
  for(let m=0;m<12;m++){g+=`<div class="ftm">${m+1}월</div>`;for(let d=1;d<=31;d++){const dt=new Date(y,m,d);g+=dt.getMonth()!==m?'<div class="ftc x"></div>':`<div class="ftc${dowIdx(dt)===6?' su':''}"></div>`}}
  return {title:`${y}년 실천 체크표`,html:`<h1 class="ph1">DDD 실천 체크표 <small>${y}년, DDD Diary를 쓴 날에 칠하거나 표시하세요</small></h1><div class="ftrack">${g}</div>
   <div class="flegend"><span><i class="k1"></i>Design만 했어요</span><span><i class="k2"></i>Design과 Do를 했어요</span><span><i class="k3"></i>Design, Do, Develop 모두 했어요</span></div>`}}
function formMonth(y,m){const first=new Date(y,m,1),last=new Date(y,m+1,0);const start=monday(first);const weeks=Math.ceil((dowIdx(first)+last.getDate())/7);let c='';
  for(let i=0;i<weeks*7;i++){const d=addDays(start,i);const inM=d.getMonth()===m;c+=`<div class="fcc${inM?'':' o'}${i%7===6?' su':''}${i%7===5?' sa':''}"><b>${d.getDate()}</b></div>`}
  return {title:`${y}년 ${m+1}월`,html:`<h1 class="ph1">${m+1}월 <small>${y} Monthly</small></h1>
  <div class="fmon"><div class="fcal" style="grid-template-rows:auto repeat(${weeks},1fr)">${DOW.map((x,i)=>`<div class="fcd${i===6?' su':i===5?' sa':''}">${x}</div>`).join('')}${c}</div>
   <aside class="fside"><div class="fq"><span>이달의 다짐</span>${flines(2,21)}</div><div class="fq"><span>월간 목표</span>${fchecks(6,21)}</div><div class="fq"><span>중요한 날</span>${flines(3,21)}</div><div class="fq"><span>월간 회고 (Develop)</span>${flines(5,21)}</div><div class="frate">목표 달성 ____ / ____ &nbsp; 하루 계획 실행 ____ %</div></aside></div>`}}
function formWeek(mon,y){
  const sun=addDays(mon,6);const L=weekLabel(mon,y);
  const hours=Array.from({length:18},(_,i)=>i+6);
  const day=i=>{const d=addDays(mon,i);return `<div class="fwd"><div class="fwh${i===6?' su':i===5?' sa':''}"><b>${d.getMonth()+1}/${d.getDate()}</b> ${DOW[i]}</div>
    <div class="fwl" style="color:#2F6BFF">Design</div>${fchecks(4,15)}
    <div class="fwl" style="color:#16A34A">Do</div><div class="fdo">${hours.map(h=>`<div class="fdr"><em>${h}</em><span></span><span></span><span></span><span></span><span></span><span></span></div>`).join('')}</div>
    <div class="fwl" style="color:#8B3FE0">Develop</div>${flines(2,15)}</div>`};
  return {title:`${y}년 ${L.idx}주차`,html:`<div class="fwtitle"><h1 class="ph1">${L.m+1}월 ${L.nth}주차 <small>${mon.getMonth()+1}.${mon.getDate()} (월) – ${sun.getMonth()+1}.${sun.getDate()} (일) | ${y}년 ${L.idx}주차</small></h1></div>
   <div class="fwtop"><div class="fq"><span>주간 다짐</span>${flines(1,19)}<span style="margin-top:4px">주간 목표</span>${fchecks(3,17)}</div>
    <div class="fq"><span>시간 배분 계획</span><table class="ftbl"><tr><th>카테고리</th><th>하루 계획</th><th>× 7 = 주</th><th>실행</th><th>일치도</th></tr>${'<tr><td></td><td>&nbsp;&nbsp;시간 &nbsp;&nbsp;분</td><td></td><td></td><td>%</td></tr>'.repeat(4)}</table></div>
    <div class="fq"><span>주간 회고 (Develop)</span>${flines(4,17)}</div></div>
   <div class="fweek">${Array.from({length:7},(_,i)=>day(i)).join('')}</div>`};
}
const monthWeeks=(y,m)=>yearWeeks(y).filter(w=>thursOf(w).getMonth()===m);
function defaultForm(){const now=new Date();const mon=monday(now);const th=thursOf(mon);const y=th.getFullYear(),m=th.getMonth();const wi=monthWeeks(y,m).findIndex(w=>w.getTime()===mon.getTime());return {year:y,kind:'weekly',month:m,week:wi>=0?wi+1:1}}
function formPages(sp){
  const f=sp.form||defaultForm();const y=f.year||new Date().getFullYear();const kind=f.kind||'yearly';const m=f.month===''||f.month==null?0:+f.month;const pages=[];
  if(kind==='yearly'){pages.push(formCover(y),formLook(y),formYearCal(y),formYearPlan(y),formTracker(y));const ws=yearWeeks(y);
    for(let mm=0;mm<12;mm++){pages.push(formMonth(y,mm));for(const w of ws)if(thursOf(w).getMonth()===mm)pages.push(formWeek(w,y))}}
  else if(kind==='monthly')pages.push(formMonth(y,m));
  else{const ws=monthWeeks(y,m);const w=ws[Math.min(ws.length,Math.max(1,f.week||1))-1];if(w)pages.push(formWeek(w,y))}
  return pages;
}
function showFastGuide(onPdf,onPrint){
  let g=$('#fastGuide');if(!g){g=document.createElement('div');g.id='fastGuide';g.className='modal';g.style.zIndex='70';document.body.appendChild(g)}
  g.innerHTML=`<div class="mbox" role="dialog" aria-modal="true" aria-labelledby="fgT"><h3 id="fgT">⚡ 빠르게 받는 방법</h3>
    <p class="hint" style="margin:0">PDF 파일 만들기는 쪽마다 그림으로 바꿔서 1년치는 몇 분 걸려요. 브라우저의 인쇄 기능으로 PDF를 저장하면 몇 초면 끝나고 글자도 더 선명해요.</p>
    <ol class="fg"><li><b>인쇄 창 열기</b>를 누르세요.</li><li>인쇄 창의 <b>대상(프린터)</b>에서 <b>PDF로 저장</b>을 고르세요.<small>크롬·엣지: 대상 → PDF로 저장 / 사파리: 왼쪽 아래 PDF → PDF로 저장 / 아이폰·아이패드: 공유 → 프린트 → 두 손가락으로 미리보기를 벌려 공유</small></li><li>용지 <b>A4</b>, 레이아웃 <b>가로</b>, 여백 <b>없음</b>으로 하고, 더보기 설정에서 <b>배경 그래픽</b>을 켜세요.</li><li><b>저장</b>을 누르면 끝이에요.</li></ol>
    <p class="hint" style="margin:0">인쇄 창이 열리지 않으면 이 다이어리 링크를 브라우저 새 탭에서 직접 연 뒤 다시 해 보세요.</p>
    <div class="mfoot" style="flex-wrap:wrap"><button class="ghost" id="fgX">닫기</button><span class="sp"></span>${onPdf?'<button class="ghost" id="fgPdf">그래도 PDF 파일로 만들기</button>':''}<button class="primary" id="fgPrint">인쇄 창 열기 (빠름)</button></div></div>`;
  g.hidden=false;const close=()=>{g.hidden=true;g.innerHTML=''};
  g.onclick=e=>{if(e.target===g)close()};$('#fgX').onclick=close;
  $('#fgPrint').onclick=()=>{close();onPrint&&onPrint()};if($('#fgPdf'))$('#fgPdf').onclick=()=>{close();onPdf()};
  setTimeout(()=>$('#fgPrint').focus(),30);
}
function formCount(f){return formPages({form:f}).length}

const DEVF=[['good','🏆','잘한 점 · 성취','오늘 해낸 일, 칭찬하고 싶은 점'],['bad','🤔','아쉬운 점 · 계획과 달랐던 이유','계획대로 안 된 일과 그 이유'],['learn','💡','오늘 배운 점','새로 알게 된 것, 깨달은 것'],['next','🌱','내일의 다짐 · 개선점','내일 하루에 반영할 한 가지']];
function devText(d){if(!d)return '';const v=d.dev||{};const parts=DEVF.filter(([k])=>(v[k]||'').trim()).map(([k,,l])=>`[${l.split(' · ')[0]}] ${v[k].trim()}`);if(String(d.see||'').trim())parts.push(d.see.trim());return parts.join('\n')}
function drawDevCmp(){
  const el=$('#devCmp');if(!el)return;const k=dkey(UI.date);const d=peekDay(k)||{todos:[],entries:[]};
  const td=d.todos||[],n=td.filter(t=>t.done).length;let mins=0;(d.entries||[]).forEach(e=>mins+=e.e-e.s);
  const mon=monday(UI.date),w=S.weeks['w'+dkey(mon)]||{};const pc=planCompare(w.targets||{},weekStats(mon).by);
  const rate=td.length?Math.round(n/td.length*100):null;
  el.innerHTML=`<div class="devcmp"><div><span>계획 실천</span><b>${td.length?`${n}/${td.length}`:'–'}</b>${rate!=null?`<i><em style="width:${rate}%"></em></i><small>${rate}%</small>`:'<small>Design에 할 일을 적어 보세요</small>'}</div>
    <div><span>Do 실행 기록</span><b>${dur(mins)}</b><small>시간대별로 칠한 시간</small></div>
    <div><span>이번 주 시간 계획 일치도</span><b>${pc.match!=null?pc.match+'%':'–'}</b><small>${pc.match!=null?'주간 계획 대비 실제':'주간 계획에서 목표 시간을 정하면 보여요'}</small></div></div>`;
}
function drawYdNote(){
  const el=$('#ydNote');if(!el)return;const k=dkey(UI.date);const prev=peekDay(dkey(addDays(UI.date,-1)));const next=((prev&&prev.dev&&prev.dev.next)||'').trim();
  if(!next){el.innerHTML='';return}
  el.innerHTML=`<div class="ydnote"><b>🌱 어제 정한 다짐</b><p>${esc(next)}</p><button class="ghost" id="ydAdd">오늘 할 일로 추가</button></div>`;
  $('#ydAdd').onclick=()=>{const t=next.split('\n')[0].slice(0,80);const d=day(k);if(d.todos.some(x=>x.text===t)){toast('이미 오늘 할 일에 있어요');return}d.todos.push({id:uid(),text:t,done:false,time:''});touch(wkOf(k));drawPlan();toast('오늘 할 일에 추가했어요')};
}
function renderAbout(){
  const st=[['design','1','DESIGN','하루를 설계하다','계획','하루를 시작하기 전, 오늘 이루고 싶은 목표와 해야 할 일을 정합니다. 중요한 일의 우선순위를 세우고, 시간을 어떻게 사용할지 구체적으로 계획합니다.','오늘 무엇을, 언제, 어떻게 할 것인가?','하루 화면의 Design(오늘 할 일, 어제의 다짐), 주간·월간·연간 계획'],
    ['do','2','DO','계획을 실천하다','실행','계획을 실제 행동으로 옮깁니다. 할 일을 하나씩 완료하고, 실제 활동과 사용한 시간을 기록합니다. 계획대로 되지 않은 순간도 괜찮습니다.','오늘 무엇을 실제로 실행했는가?','완료 체크, 시간대별 형광펜 기록, 타이머, 반복 일과, 사진'],
    ['dev','3','DEVELOP','돌아보고 성장하다','회고·개선','하루를 마무리하며 계획과 실행을 비교합니다. 잘한 점과 아쉬운 점, 계획과 달랐던 이유를 돌아보고, 배운 점을 내일의 계획에 반영합니다.','오늘 무엇을 배웠고, 내일은 무엇을 개선할 것인가?','계획 대비 실행 비교, 잘한 점·아쉬운 점·배운 점, 내일의 다짐, 주간·월간 회고, 모아보기 그래프']];
  main.innerHTML=`<div class="about">
    <img class="abimg" src="${BRAND_IMG}" alt="DDD Diary 소개: Design 하루를 설계하다, Do 계획을 실천하다, Develop 돌아보고 성장하다">
    <section class="sheet abintro"><h1 class="ablogo">${LOGO}</h1><p class="abtag">Design · Do · Develop</p>
      <p class="ablead">계획이 실행이 되고, 실행이 성장으로 이어지는 하루.</p>
      <p>우리는 매일 새로운 하루를 시작합니다. 오늘 해야 할 일을 계획하고, 목표를 이루기 위해 행동하지만, 바쁜 일상 속에서 정작 자신의 하루를 돌아보는 시간은 놓치기 쉽습니다.</p>
      <p>DDD Diary는 하루를 계획하고, 실천하고, 돌아보는 과정을 통해 매일 조금씩 성장할 수 있도록 돕는 자기관리 다이어리입니다.</p></section>
    <div class="absteps">${st.map(([c,n,en,ko,sub,txt,q,f])=>`<section class="sheet abstep stage-${c}"><h2><span class="stg">${n} ${en}</span></h2><h3>${ko} <small>(${sub})</small></h3><p>${txt}</p><p class="abq"><b>핵심 질문</b> ${q}</p><p class="abf">이 앱에서: ${f}</p></section>`).join('')}</div>
    <section class="sheet abend"><p><b>DDD Diary에서 성장은 단순한 결과가 아닙니다. 계획하고, 실천하고, 돌아보는 과정에서 만들어지는 변화입니다.</b></p>
      <p>완벽한 하루보다 의미 있는 하루를, 어제와 똑같은 반복보다 조금씩 나아지는 내일을 만들어 갑니다.</p>
      <p class="abslogan"><span>Design</span> your day. <span>Do</span> what matters. <span>Develop</span> through reflection.</p>
      <p class="hint">하루를 설계하세요. 중요한 일을 실천하세요. 돌아보며 성장하세요.</p>
      <button class="primary" id="abGo">오늘 하루 설계하러 가기</button></section></div>`;
  $('#abGo').onclick=()=>{UI.view='day';UI.date=new Date();render();window.scrollTo(0,0)};
}

/* ---------- toast ---------- */
let toastT=null;
function toast(msg,actLabel,act){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${actLabel?`<button>${esc(actLabel)}</button>`:''}`;t.hidden=false;if(actLabel)t.querySelector('button').onclick=()=>{t.hidden=true;act()};clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,actLabel?7000:3000)}

/* ---------- boot ---------- */
try{const th=localStorage.getItem('pds-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
render();
setInterval(tickTracker,1000);
setInterval(()=>{if(AUTH.state==='ready'&&UI.view==='day'&&!dragging&&dkey(UI.date)===todayKey())drawGrid()},30000);
setInterval(()=>{if(AUTH.state==='ready'&&dkey(monday(new Date()))!==lastRoutineMon){checkRoutines();if(!dragging&&$('#modal').hidden)render()}},60000);
window.addEventListener('pagehide',()=>{flush();syncMember()});
boot();
})();
</script>
</body>
</html>
